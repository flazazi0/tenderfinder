name: Update tenders

on:
  schedule:
    - cron: "30 5 * * *"   # every morning, 6:30 UK summer time / 5:30 winter
  workflow_dispatch:        # adds a "Run workflow" button for running it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new tenders
        run: python update.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update tenders"
          git push
